<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My ChatGPT</title>
<style>
  :root {
    --bg: #ffffff;
    --user-bubble: #f4f4f4;
    --text: #0d0d0d;
    --muted: #8f8f8f;
    --border: #e5e5e5;
    --accent: #000000;
    --composer-bg: #f4f4f4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; height: 100dvh; }

  /* 상단 헤더 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    flex-shrink: 0;
  }
  .header-btn {
    width: 40px; height: 40px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 10px; color: var(--text);
  }
  .header-btn:active { background: #f0f0f0; }
  .header-title {
    font-size: 17px; font-weight: 600; color: var(--text);
  }

  /* AI 선택 탭 */
  .provider-tabs {
    display: flex; gap: 6px;
    padding: 4px 16px 10px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .provider-tab {
    flex-shrink: 0;
    padding: 7px 16px; border-radius: 18px; border: 1px solid #e5e5e5;
    background: #fff; color: var(--muted);
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .provider-tab.active {
    background: #0d0d0d; color: #fff; border-color: #0d0d0d;
  }
  .provider-tab .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #ccc;
  }
  .provider-tab.active .dot { background: #4ade80; }
  .provider-tab.soon { opacity: .55; cursor: default; }

  /* 모델 선택 버튼 */
  .model-bar {
    display: flex; justify-content: flex-end;
    padding: 0 16px 8px;
    flex-shrink: 0;
    position: relative;
  }
  .model-btn {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 14px; border: 1px solid #e5e5e5;
    background: #fff; color: var(--muted);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .model-btn:active { background: #f5f5f5; }
  .model-menu {
    position: absolute; top: 34px; right: 16px;
    background: #fff; border-radius: 14px;
    box-shadow: 0 6px 28px rgba(0,0,0,.15);
    padding: 6px; min-width: 220px;
    display: none; z-index: 25;
  }
  .model-menu.show { display: block; }
  .model-option {
    display: flex; flex-direction: column; align-items: flex-start;
    width: 100%; padding: 10px 12px; border: none; background: transparent;
    border-radius: 10px; cursor: pointer; text-align: left;
    font-family: inherit;
  }
  .model-option:active { background: #f2f2f2; }
  .model-option.selected { background: #f5f5f5; }
  .model-option .name { font-size: 14px; font-weight: 700; color: #0d0d0d; }
  .model-option .desc { font-size: 12px; color: var(--muted); margin-top: 1px; }

  /* 대화 영역 */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 8px 0 20px;
    display: flex; flex-direction: column;
  }
  .chat-inner {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 0 16px;
    display: flex; flex-direction: column; gap: 18px;
  }

  /* 맨 아래로 이동 버튼 (스크롤을 위로 올렸을 때만 나타남) */
  .scroll-bottom-btn {
    position: fixed;
    left: 50%; transform: translateX(-50%) translateY(8px);
    bottom: 84px; /* composer 위에 뜨도록 */
    width: 40px; height: 40px; border-radius: 50%;
    background: #ffffff; border: 1px solid #e5e5e5;
    box-shadow: 0 2px 10px rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 30;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .scroll-bottom-btn.show {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .scroll-bottom-btn:active { background: #f2f2f2; }

  /* 시작 화면 안내 */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); text-align: center; gap: 12px;
    padding: 40px 20px;
  }
  .welcome h1 { font-size: 24px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 15px; }

  /* 메시지 */
  .msg { display: flex; width: 100%; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 85%;
    font-size: 16px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
    -webkit-user-select: text; user-select: text; /* 길게 눌러 복사 가능하게 */
    -webkit-touch-callout: default;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    padding: 10px 16px; border-radius: 20px;
  }
  .msg.assistant .bubble {
    padding: 2px 0;
    max-width: 100%; /* 답변은 말풍선이 아니라 텍스트라 폭 제한을 풀어 표 등을 넓게 쓴다 */
  }
  .bubble img {
    max-width: 220px; border-radius: 14px; margin-bottom: 8px; display: block;
  }
  .typing { color: var(--muted); }

  /* 마크다운 서식 (어시스턴트 답변) */
  .msg.assistant .bubble p { margin: 0 0 12px; }
  .msg.assistant .bubble p:last-child { margin-bottom: 0; }
  .msg.assistant .bubble strong { font-weight: 700; }
  .msg.assistant .bubble ul,
  .msg.assistant .bubble ol { margin: 0 0 12px; padding-left: 22px; }
  .msg.assistant .bubble li { margin: 4px 0; }
  .msg.assistant .bubble h1,
  .msg.assistant .bubble h2,
  .msg.assistant .bubble h3 { font-size: 17px; font-weight: 700; margin: 16px 0 8px; }
  .msg.assistant .bubble code {
    background: #f0f0f0; padding: 2px 6px; border-radius: 6px;
    font-size: 14px; font-family: ui-monospace, monospace;
  }
  .msg.assistant .bubble pre {
    background: #f4f4f4; padding: 12px; border-radius: 12px;
    overflow-x: auto; margin: 0 0 12px;
  }
  .msg.assistant .bubble pre code { background: none; padding: 0; }
  .msg.assistant .bubble blockquote {
    border-left: 3px solid #ddd; margin: 0 0 12px; padding-left: 12px; color: #555;
  }
  .msg.assistant .bubble a { color: #2964aa; }
  .msg.assistant .bubble table {
    border-collapse: collapse; width: max-content; max-width: 100%;
    margin: 0 0 12px; font-size: 15px;
  }
  .msg.assistant .bubble .table-scroll {
    overflow-x: auto; margin: 0 0 12px; -webkit-overflow-scrolling: touch;
  }
  .msg.assistant .bubble .table-scroll table { margin: 0; }
  .msg.assistant .bubble th,
  .msg.assistant .bubble td {
    padding: 10px 20px 10px 0; text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid #e5e5e5;
  }
  .msg.assistant .bubble th {
    font-weight: 700; color: #0d0d0d;
    border-bottom: 1.5px solid #0d0d0d;
  }
  .msg.assistant .bubble td { color: #333; }

  /* 하단 입력 영역 */
  .composer-wrap {
    flex-shrink: 0;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--composer-bg);
    border-radius: 26px;
    padding: 6px 6px 6px 8px;
  }
  .plus-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: var(--text);
    transition: transform .2s;
  }
  .plus-btn:active { background: #e8e8e8; }
  .plus-btn.open { transform: rotate(45deg); }
  #input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 16px; line-height: 1.4; resize: none;
    max-height: 140px; padding: 8px 4px; color: var(--text);
    font-family: inherit;
  }
  #input::placeholder { color: var(--muted); }
  .send-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    border: none; border-radius: 50%; cursor: pointer;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .2s;
  }
  .send-btn:disabled { opacity: .3; cursor: default; }

  /* + 메뉴 */
  .menu-overlay {
    position: fixed; inset: 0; z-index: 40;
    display: none;
  }
  .menu-overlay.show { display: block; }
  .menu {
    position: absolute;
    bottom: calc(72px + env(safe-area-inset-bottom));
    left: 16px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 8px 40px rgba(0,0,0,.16);
    padding: 8px;
    min-width: 260px;
    display: flex; flex-direction: column;
    transform: translateY(8px) scale(.96);
    opacity: 0;
    transition: transform .18s ease, opacity .18s ease;
  }
  .menu-overlay.show .menu {
    transform: translateY(0) scale(1); opacity: 1;
  }
  .menu-item {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; border: none; background: transparent;
    cursor: pointer; border-radius: 14px; width: 100%;
    font-size: 17px; color: var(--text); text-align: left;
    font-family: inherit;
  }
  .menu-item:active { background: #f2f2f2; }
  .menu-item svg { flex-shrink: 0; }

  /* 날씨 입력 모달 */
  .weather-modal {
    position: absolute;
    bottom: calc(72px + env(safe-area-inset-bottom));
    left: 16px; right: 16px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 8px 40px rgba(0,0,0,.16);
    padding: 20px;
    transform: translateY(8px) scale(.96);
    opacity: 0;
    transition: transform .18s ease, opacity .18s ease;
  }
  .menu-overlay.show .weather-modal {
    transform: translateY(0) scale(1); opacity: 1;
  }
  .weather-modal-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  .weather-loc-input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #e0e0e0; font-size: 15px; font-family: inherit;
    outline: none; margin-bottom: 10px;
  }
  .weather-loc-input:focus { border-color: #0d0d0d; }
  .weather-submit-btn {
    width: 100%; padding: 12px; border-radius: 12px; border: none;
    background: #0d0d0d; color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; margin-bottom: 8px;
  }
  .weather-mylocation-btn {
    width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #e0e0e0;
    background: #fff; color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .weather-modal-msg { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 16px; }

  /* 날씨 결과 카드 (대화창에 표시) */
  .weather-card {
    display: inline-block; background: #f7f7f8; border-radius: 18px;
    padding: 18px 22px; max-width: 280px;
  }
  .weather-card .wc-location { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .weather-card .wc-temp { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .weather-card .wc-desc { font-size: 15px; margin: 4px 0 10px; }
  .weather-card .wc-details {
    display: flex; gap: 16px; font-size: 13px; color: var(--muted);
    padding-top: 10px; border-top: 1px solid #e5e5e5;
  }

  /* 이미지 미리보기 (전송 전) */
  .preview {
    max-width: 760px; margin: 0 auto 8px;
    display: none;
  }
  .preview.show { display: block; }
  .preview-inner {
    display: inline-flex; position: relative;
  }
  .preview img {
    max-height: 80px; max-width: 120px; height: auto; width: auto;
    display: block; border-radius: 12px; object-fit: cover;
  }
  .preview .remove {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #000; color: #fff; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; line-height: 1;
  }
</style>
</head>
<body>
  <header>
    <button class="header-btn" aria-label="메뉴">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="14" y2="16"/></svg>
    </button>
    <div class="header-title">My ChatGPT</div>
    <button class="header-btn" aria-label="새 대화" onclick="newChat()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </header>

  <div class="provider-tabs" id="providerTabs">
    <button class="provider-tab active" data-provider="gpt" onclick="switchProvider('gpt')">
      <span class="dot"></span>GPT
    </button>
    <button class="provider-tab" data-provider="claude" onclick="switchProvider('claude')">
      <span class="dot"></span>Claude
    </button>
    <button class="provider-tab soon" data-provider="perplexity" onclick="switchProvider('perplexity')">
      <span class="dot"></span>Perplexity <span style="font-size:11px">(준비중)</span>
    </button>
  </div>

  <div class="model-bar">
    <button class="model-btn" id="modelBtn" onclick="toggleModelMenu()">
      <span id="modelBtnLabel">Luna</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="model-menu" id="modelMenu"></div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>무엇을 도와드릴까요?</h1>
      <p>옷 사진을 올리거나, 고민이나 궁금한 걸 물어보세요.</p>
    </div>
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <button class="scroll-bottom-btn" id="scrollBottomBtn" onclick="scrollToBottom()" aria-label="맨 아래로 이동">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
  </button>

  <div class="preview" id="preview">
    <div class="preview-inner">
      <img id="previewImg" alt="첨부 이미지">
      <div class="remove" onclick="removeImage()">✕</div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <button class="plus-btn" id="plusBtn" onclick="toggleMenu()" aria-label="추가">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="무엇이든 물어보세요"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" disabled aria-label="보내기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>

  <!-- + 메뉴 -->
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()">
    <div class="menu" onclick="event.stopPropagation()">
      <button class="menu-item" onclick="pickImage('camera')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        카메라
      </button>
      <button class="menu-item" onclick="pickImage('photo')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        사진
      </button>
      <button class="menu-item" onclick="pickImage('file')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        파일
      </button>
      <button class="menu-item" onclick="openWeatherModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h.79a4.5 4.5 0 1 1 0 9z"/></svg>
        날씨
      </button>
    </div>
  </div>

  <!-- 날씨 지역 입력 모달 -->
  <div class="menu-overlay" id="weatherOverlay" onclick="closeWeatherModal()">
    <div class="weather-modal" onclick="event.stopPropagation()">
      <div class="weather-modal-title">날씨 확인</div>
      <input type="text" id="weatherLocInput" class="weather-loc-input"
             placeholder="지역명 입력 (예: 고양시 일산동구)"
             onkeydown="if(event.key==='Enter') submitWeatherLocation()">
      <button class="weather-submit-btn" onclick="submitWeatherLocation()">확인</button>
      <button class="weather-mylocation-btn" onclick="useMyLocation()">📍 현재 위치 사용</button>
      <div class="weather-modal-msg" id="weatherModalMsg"></div>
    </div>
  </div>

  <!-- 숨겨진 파일 입력들 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFile(this)">
  <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onFile(this)">
  <input type="file" id="fileInput" accept="image/*,.pdf,.txt" style="display:none" onchange="onFile(this)">

<script>
  const SYSTEM_PROMPT = `You are an assistant similar to ChatGPT.
Response style:
- Give a clear conclusion first.
- Then explain reasons in structured sections.
- Use short paragraphs or bullet points.
- Speak naturally like a human conversation.
- If the user writes in Korean, respond in Korean.
When the user shares an image (e.g. clothing), describe what you see and give honest, helpful feedback.
For health questions, give general information and gently remind the user to consult a medical professional for anything important.`;

  // provider(gpt/claude/perplexity)마다 대화 기록을 따로 보관한다.
  let currentProvider = "gpt";
  const conversations = {
    gpt: [{ role: "system", content: SYSTEM_PROMPT }],
    claude: [{ role: "system", content: SYSTEM_PROMPT }],
    perplexity: [{ role: "system", content: SYSTEM_PROMPT }],
  };
  // 아직 연결 안 된 provider (1단계: GPT만 실제 연결)
  const READY_PROVIDERS = { gpt: true, claude: true, perplexity: false };
  let attachedImage = null; // { dataUrl, mime }

  // provider별로 고를 수 있는 모델 목록. 첫 번째가 기본(저렴이)값.
  const MODEL_OPTIONS = {
    gpt: [
      { id: "gpt-5.6-luna", label: "Luna", desc: "빠르고 저렴 · 기본값" },
      { id: "gpt-5.6-terra", label: "Terra", desc: "균형 잡힌 중간 모델" },
      { id: "gpt-5.6-sol", label: "Sol", desc: "가장 강력 · 비용 높음" },
    ],
    claude: [
      { id: "claude-haiku-4-5-20251001", label: "Haiku", desc: "빠르고 저렴 · 기본값" },
      { id: "claude-sonnet-5", label: "Sonnet", desc: "균형 잡힌 중간 모델" },
      { id: "claude-opus-5", label: "Opus", desc: "가장 강력 · 비용 높음(Haiku의 약 5배)" },
    ],
    perplexity: [
      { id: "sonar", label: "Sonar", desc: "빠르고 저렴 · 기본값(항상 검색 포함)" },
      { id: "sonar-pro", label: "Sonar Pro", desc: "더 깊은 검색·분석" },
    ],
  };
  // 현재 선택된 모델 (provider별로 하나씩). 처음엔 각 provider의 기본(0번째) 모델.
  const selectedModel = {
    gpt: MODEL_OPTIONS.gpt[0].id,
    claude: MODEL_OPTIONS.claude[0].id,
    perplexity: MODEL_OPTIONS.perplexity[0].id,
  };

  // 마크다운(**굵게**, 목록, 제목 등)을 HTML로 변환한다. 외부 라이브러리 없이 직접 처리.
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  // 한 줄 안의 인라인 서식 처리: **굵게**, *기울임*, `코드`, [링크](url)
  function inlineFormat(s) {
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                  '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  function renderMarkdown(text) {
    const lines = text.split("\n");
    let html = "";
    let listType = null; // 'ul' 또는 'ol'
    let paragraph = [];

    function flushParagraph() {
      if (paragraph.length) {
        html += "<p>" + paragraph.map(inlineFormat).join("<br>") + "</p>";
        paragraph = [];
      }
    }
    function closeList() {
      if (listType) { html += "</" + listType + ">"; listType = null; }
    }
    // "| a | b | c |" 형태의 한 줄을 셀 배열로 쪼갠다.
    function splitTableRow(line) {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map(c => c.trim());
    }
    // "|---|:--:|---|" 같은 구분선인지 확인
    function isTableDivider(line) {
      const s = line.trim();
      if (!s.includes("|") || !s.includes("-")) return false;
      return /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(s);
    }

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i];
      const line = raw.trimEnd();

      // 표: 현재 줄이 |로 시작하고, 다음 줄이 구분선(|---|---|)이면 표로 처리
      if (line.trim().startsWith("|") && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
        flushParagraph(); closeList();
        const headerCells = splitTableRow(line);
        html += '<div class="table-scroll"><table><thead><tr>';
        for (const cell of headerCells) html += "<th>" + inlineFormat(cell) + "</th>";
        html += "</tr></thead><tbody>";
        i += 2; // 헤더 줄 + 구분선 줄 건너뜀
        while (i < lines.length && lines[i].trim().startsWith("|")) {
          const rowCells = splitTableRow(lines[i]);
          html += "<tr>";
          for (const cell of rowCells) html += "<td>" + inlineFormat(cell) + "</td>";
          html += "</tr>";
          i++;
        }
        html += "</tbody></table></div>";
        i--; // for문의 i++와 겹치지 않게 보정
        continue;
      }

      // 제목 (#, ##, ###)
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      // 순서 없는 목록 (-, *, •)
      const ul = line.match(/^\s*[-*•]\s+(.*)$/);
      // 순서 있는 목록 (1. 2. ...)
      const ol = line.match(/^\s*\d+\.\s+(.*)$/);

      if (h) {
        flushParagraph(); closeList();
        const level = h[1].length;
        html += "<h" + level + ">" + inlineFormat(h[2]) + "</h" + level + ">";
      } else if (ul) {
        flushParagraph();
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += "<li>" + inlineFormat(ul[1]) + "</li>";
      } else if (ol) {
        flushParagraph();
        if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
        html += "<li>" + inlineFormat(ol[1]) + "</li>";
      } else if (line.trim() === "") {
        flushParagraph(); closeList();
      } else {
        closeList();
        paragraph.push(line);
      }
    }
    flushParagraph(); closeList();
    return html;
  }

  const chatInner = document.getElementById("chatInner");

  // 입력창 자동 높이 + 보내기 버튼 활성화
  input.addEventListener("input", () => {

  // 터치 기기(폰)인지 확인 - 폰에서는 엔터가 줄바꿈, 화면의 보내기 버튼으로만 전송
  const isTouchDevice = window.matchMedia("(pointer: coarse)").matches;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      if (isTouchDevice) return; // 폰에서는 그냥 줄바꿈 (기본 동작 그대로 둠)
      e.preventDefault();
      send();
    }
  });
  // 클립보드에 복사된 이미지를 Ctrl+V(또는 길게 눌러 붙여넣기)로 바로 첨부할 수 있게 한다.
  input.addEventListener("paste", (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type && item.type.startsWith("image/")) {
        e.preventDefault(); // 이미지면 텍스트로 안 붙여넣고 사진으로 처리
        const file = item.getAsFile();
        if (file) processImageFile(file);
        break;
      }
    }
  });

  // WMO 날씨 코드를 한글 설명 + 이모지로 변환
  function weatherCodeInfo(code) {

      0: ["맑음", "☀️"], 1: ["대체로 맑음", "🌤️"], 2: ["구름 조금", "⛅"], 3: ["흐림", "☁️"],
      45: ["안개", "🌫️"], 48: ["짙은 안개", "🌫️"],
      51: ["약한 이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["강한 이슬비", "🌦️"],
      56: ["어는 이슬비", "🌦️"], 57: ["강한 어는 이슬비", "🌦️"],
      61: ["약한 비", "🌧️"], 63: ["비", "🌧️"], 65: ["강한 비", "🌧️"],
      66: ["어는 비", "🌧️"], 67: ["강한 어는 비", "🌧️"],
      71: ["약한 눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["강한 눈", "🌨️"], 77: ["진눈깨비", "🌨️"],
      80: ["약한 소나기", "🌧️"], 81: ["소나기", "🌧️"], 82: ["강한 소나기", "🌧️"],
      85: ["약한 소나기눈", "🌨️"], 86: ["소나기눈", "🌨️"],
      95: ["뇌우", "⛈️"], 96: ["뇌우(우박 동반)", "⛈️"], 99: ["강한 뇌우(우박 동반)", "⛈️"],
    };
    return map[code] || ["알 수 없음", "🌡️"];
  }

  async function useMyLocation() {
    const msg = document.getElementById("weatherModalMsg");
    if (!navigator.geolocation) {
      msg.textContent = "이 브라우저에서는 위치 사용이 지원되지 않아요.";
      return;
    }
    msg.textContent = "위치 확인 중...";
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        await fetchAndShowWeather(pos.coords.latitude, pos.coords.longitude, "현재 위치");
      },
      () => { msg.textContent = "위치 권한을 허용해주시면 바로 확인할 수 있어요."; },
      { timeout: 8000 }
    );
  }

  async function submitWeatherLocation() {
    const input = document.getElementById("weatherLocInput");
    const msg = document.getElementById("weatherModalMsg");
    const query = input.value.trim();
    if (!query) { msg.textContent = "지역명을 입력해주세요."; return; }

    msg.textContent = "지역을 찾는 중...";
    try {
      // 지역명 → 위도/경도 변환 (Open-Meteo 지오코딩, 키 필요 없음)
      const geoRes = await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name=" +
        encodeURIComponent(query) + "&count=1&language=ko&format=json"
      );
      const geoData = await geoRes.json();
      if (!geoData.results || geoData.results.length === 0) {
        msg.textContent = "'" + query + "' 지역을 찾지 못했어요. 다른 이름으로 시도해보세요 (예: 고양시).";
        return;
      }
      const place = geoData.results[0];
      const label = [place.name, place.admin1].filter(Boolean).join(", ");
      await fetchAndShowWeather(place.latitude, place.longitude, label);
    } catch (err) {
      msg.textContent = "지역 검색 중 오류가 발생했어요. 다시 시도해주세요.";
    }
  }

  async function fetchAndShowWeather(lat, lon, label) {
    const msg = document.getElementById("weatherModalMsg");
    msg.textContent = "날씨 확인 중...";
    try {
      const res = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
        "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
        "&timezone=Asia%2FSeoul"
      );
      const data = await res.json();
      const cur = data.current;
      if (!cur) { msg.textContent = "날씨 정보를 가져오지 못했어요."; return; }

      const [desc, emoji] = weatherCodeInfo(cur.weather_code);
      closeWeatherModal();
      addWeatherBubble({
        label, emoji, desc,
        temp: Math.round(cur.temperature_2m),
        humidity: cur.relative_humidity_2m,
        precipitation: cur.precipitation,
        wind: cur.wind_speed_10m,
      });
    } catch (err) {
      msg.textContent = "날씨 정보를 가져오지 못했어요. 다시 시도해주세요.";
    }
  }

  // 날씨 카드를 대화창에 표시하고, 이어지는 대화(예: "우산 챙겨야해?")에서
  // AI가 참고할 수 있도록 대화 기록에도 짧은 요약을 남겨둔다.
  function addWeatherBubble(w) {
    const bubble = addBubble("assistant", {});
    bubble.innerHTML = `
      <div class="weather-card">
        <div class="wc-location">${w.label}</div>
        <div class="wc-temp">${w.emoji} ${w.temp}°</div>
        <div class="wc-desc">${w.desc}</div>
        <div class="wc-details">
          <span>💧 습도 ${w.humidity}%</span>
          <span>🌬️ 풍속 ${w.wind}km/h</span>
        </div>
      </div>`;
    scrollToMessageTop(bubble);

    // 정확한 데이터를 근거로, 지금 쓰는 AI(GPT/Claude)가 자연스러운 조언을 덧붙이게 한다.
    // (검색에 의존하지 않으므로 숫자는 항상 정확하고, 문장만 AI가 자연스럽게 다듬어줌)
    requestWeatherAdvice(w);
  }

  async function requestWeatherAdvice(w) {
    if (!READY_PROVIDERS[currentProvider]) return; // 아직 연결 안 된 provider면 조언 생략

    const userText = `${w.label} 날씨 알려줘`;
    const dataNote = `\n\n(참고: 방금 확인된 정확한 날씨 데이터 — 날씨: ${w.desc}, 기온: ${w.temp}°C, ` +
      `습도: ${w.humidity}%, 강수량: ${w.precipitation}mm, 풍속: ${w.wind}km/h. ` +
      `이 데이터만 사실로 사용해서 우산·옷차림 등 실용적인 조언을 2~3문장으로 자연스럽게 알려줘. ` +
      `이 데이터에 없는 내용(주의보 등)은 추측해서 말하지 마.)`;

    addBubble("user", { text: userText });
    conversations[currentProvider].push({ role: "user", content: userText + dataNote });

    const bubble = addBubble("assistant", {});
    bubble.innerHTML = '<span class="typing">●●●</span>';

    try {
      const endpoints = { gpt: "/api/chat", claude: "/api/chat-claude", perplexity: "/api/chat-perplexity" };
      const res = await fetch(endpoints[currentProvider], {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: conversations[currentProvider],
          model: selectedModel[currentProvider],
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        bubble.textContent = "⚠️ 조언을 가져오지 못했어요: " + (data.error || res.status);
        return;
      }
      const full = data.text || "";
      bubble.innerHTML = renderMarkdown(full);
      scrollToMessageTop(bubble);
      conversations[currentProvider].push({ role: "assistant", content: full });
    } catch (err) {
      bubble.textContent = "⚠️ 조언을 가져오지 못했어요.";
    }
  }

  function onFile(el) {
    const file = el.files[0];
    if (!file) return;
    processImageFile(file);
    el.value = "";
  }

  // 파일 선택이든 클립보드 붙여넣기든, 이미지 파일 하나를 받아 축소·압축 후 첨부한다.
  function processImageFile(file) {
    if (!file.type.startsWith("image/")) {
      alert("지금은 이미지 파일만 지원해요.");
      return;
    }
    // 사진이 너무 크면 서버가 못 받으므로(413 오류) 크기를 줄여서 첨부한다.
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1024; // 가장 긴 변을 1024px로 제한
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          if (width > height) {
            height = Math.round(height * MAX / width);
            width = MAX;
          } else {
            width = Math.round(width * MAX / height);
            height = MAX;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        // JPEG 품질 0.8로 압축 → 용량 대폭 감소
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        attachedImage = { dataUrl: dataUrl, mime: "image/jpeg" };
        document.getElementById("previewImg").src = dataUrl;
        document.getElementById("preview").classList.add("show");
        updateSendBtn();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function removeImage() {
    attachedImage = null;
    document.getElementById("preview").classList.remove("show");
    updateSendBtn();
  }

  function newChat() {
    conversations[currentProvider] = [{ role: "system", content: SYSTEM_PROMPT }];
    chatInner.innerHTML = "";
    welcome.style.display = "flex";
    removeImage();
  }

  const PROVIDER_NAMES = { gpt: "My ChatGPT", claude: "My Claude", perplexity: "My Perplexity" };

  // 탭을 눌러 다른 AI로 전환한다. 대화 기록은 provider별로 따로 보관되어 있다가 다시 보인다.
  function switchProvider(provider) {
    if (!READY_PROVIDERS[provider]) {
      alert((provider === "claude" ? "Claude" : "Perplexity") + "는 곧 연결될 예정이에요. 조금만 기다려주세요!");
      return;
    }
    currentProvider = provider;

    // 탭 활성 표시 갱신
    document.querySelectorAll(".provider-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.provider === provider);
    });
    document.querySelector(".header-title").textContent = PROVIDER_NAMES[provider];
    updateModelBtnLabel();
    closeModelMenu();

    // 해당 provider의 대화 기록을 화면에 다시 그린다
    redrawConversation();
  }

  // --- 모델 선택 버튼 ---
  function updateModelBtnLabel() {
    const opts = MODEL_OPTIONS[currentProvider];
    const cur = opts.find(o => o.id === selectedModel[currentProvider]) || opts[0];
    document.getElementById("modelBtnLabel").textContent = cur.label;
  }
  function renderModelMenu() {
    const menu = document.getElementById("modelMenu");
    const opts = MODEL_OPTIONS[currentProvider];
    menu.innerHTML = opts.map(o => {
      const isSel = o.id === selectedModel[currentProvider];
      return `<button class="model-option${isSel ? " selected" : ""}" onclick="selectModel('${o.id}')">
        <span class="name">${o.label}${isSel ? " ✓" : ""}</span>
        <span class="desc">${o.desc}</span>
      </button>`;
    }).join("");
  }
  function toggleModelMenu() {
    const menu = document.getElementById("modelMenu");
    if (menu.classList.contains("show")) { closeModelMenu(); return; }
    renderModelMenu();
    menu.classList.add("show");
  }
  function closeModelMenu() {
    document.getElementById("modelMenu").classList.remove("show");
  }
  function selectModel(id) {
    selectedModel[currentProvider] = id;
    updateModelBtnLabel();
    closeModelMenu();
  }
  // 메뉴 바깥을 누르면 닫히게
  document.addEventListener("click", (e) => {
    const bar = e.target.closest(".model-bar");
    if (!bar) closeModelMenu();
  });

  // conversations[currentProvider]의 내용을 화면에 다시 그린다 (탭 전환 시 사용)
  function redrawConversation() {
    chatInner.innerHTML = "";
    const history = conversations[currentProvider];
    const hasContent = history.some(m => m.role !== "system");
    welcome.style.display = hasContent ? "none" : "flex";

    for (const m of history) {
      if (m.role === "system") continue;
      if (m.role === "user") {
        if (typeof m.content === "string") {
          addBubble("user", { text: m.content });
        } else {
          const textPart = m.content.find(p => p.type === "text");
          const imgPart = m.content.find(p => p.type === "image_url");
          addBubble("user", {
            text: textPart ? textPart.text : "",
            imageUrl: imgPart ? imgPart.image_url.url : null,
          });
        }
      } else if (m.role === "assistant") {
        const b = addBubble("assistant", {});
        b.innerHTML = renderMarkdown(m.content);
      }
    }
    scrollToBottom();
  }

  function addBubble(role, opts = {}) {
    welcome.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (opts.imageUrl) {
      const img = document.createElement("img");
      img.src = opts.imageUrl;
      bubble.appendChild(img);
    }
    if (opts.text) {
      const span = document.createElement("span");
      span.textContent = opts.text;
      bubble.appendChild(span);
    }
    wrap.appendChild(bubble);
    chatInner.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
    updateScrollBtn();
  }

  // 긴 답변이 왔을 때 끝부분이 아니라 "시작 부분"이 보이게 스크롤한다.
  // (실제 ChatGPT처럼 답변을 처음부터 읽을 수 있게)
  function scrollToMessageTop(bubble) {
    const wrap = bubble.closest(".msg");
    if (!wrap) { scrollToBottom(); return; }
    // 메시지 상단이 화면 위쪽에 오도록, 헤더 높이만큼 여유를 둔다.
    const target = wrap.offsetTop - 12;
    chat.scrollTop = Math.max(0, target);
    updateScrollBtn();
  }

  // 스크롤을 위로 올려서 맨 아래(최신 메시지)가 안 보이면 "맨 아래로" 버튼을 띄운다.
  const scrollBottomBtn = document.getElementById("scrollBottomBtn");
  function updateScrollBtn() {
    const distanceFromBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
    if (distanceFromBottom > 120) {
      scrollBottomBtn.classList.add("show");
    } else {
      scrollBottomBtn.classList.remove("show");
    }
  }
  chat.addEventListener("scroll", updateScrollBtn);

  async function send() {
    const text = input.value.trim();
    if (!text && !attachedImage) return;

    // 사용자 메시지 화면에 표시
    addBubble("user", {
      text: text,
      imageUrl: attachedImage ? attachedImage.dataUrl : null,
    });

    // API용 메시지 구성
    let userContent;
    if (attachedImage) {
      userContent = [
        { type: "text", text: text || "이 이미지를 봐줘." },
        { type: "image_url", image_url: { url: attachedImage.dataUrl } },
      ];
    } else {
      userContent = text;
    }
    conversations[currentProvider].push({ role: "user", content: userContent });

    // 입력창 초기화
    input.value = "";
    input.style.height = "auto";
    removeImage();
    updateSendBtn();

    // 어시스턴트 말풍선(타이핑 표시)
    const bubble = addBubble("assistant", {});
    bubble.innerHTML = '<span class="typing">●●●</span>';

    // 시간이 걸리면 "아직 처리 중"이라는 걸 알려주는 안내를 단계적으로 띄운다.
    // (검색이 낀 질문은 몇 초~십몇 초 걸릴 수 있어 화면이 멈춘 것처럼 보일 수 있음)
    const waitTimer1 = setTimeout(() => {
      bubble.innerHTML = '<span class="typing">●●● 조금 시간이 걸리고 있어요...</span>';
    }, 3000);
    const waitTimer2 = setTimeout(() => {
      bubble.innerHTML = '<span class="typing">●●● 웹 검색 등을 확인하는 중일 수 있어요. 잠시만요...</span>';
    }, 8000);

    try {
      // provider마다 다른 서버 엔드포인트를 호출한다 (2·3단계에서 claude/perplexity 추가 예정)
      const endpoints = { gpt: "/api/chat", claude: "/api/chat-claude", perplexity: "/api/chat-perplexity" };
      const res = await fetch(endpoints[currentProvider], {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: conversations[currentProvider],
          model: selectedModel[currentProvider],
        }),
      });

      clearTimeout(waitTimer1);
      clearTimeout(waitTimer2);

      const data = await res.json();

      if (!res.ok) {
        bubble.textContent = "⚠️ 오류가 발생했습니다: " + (data.error || res.status);
        return;
      }

      const full = data.text || "(답변을 받지 못했어요. 다시 시도해 주세요.)";
      bubble.innerHTML = renderMarkdown(full);
      scrollToMessageTop(bubble);
      conversations[currentProvider].push({ role: "assistant", content: full });
    } catch (err) {
      clearTimeout(waitTimer1);
      clearTimeout(waitTimer2);
      bubble.textContent = "⚠️ 연결 오류: " + err;
    }
  }
</script>
</body>
</html>
