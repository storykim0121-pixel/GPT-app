<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My ChatGPT</title>
<style>
  :root {
    --bg: #ffffff;
    --user-bubble: #f4f4f4;
    --text: #0d0d0d;
    --muted: #8f8f8f;
    --border: #e5e5e5;
    --accent: #000000;
    --composer-bg: #f4f4f4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; height: 100dvh; }

  /* 상단 헤더 */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    flex-shrink: 0;
  }
  .header-btn {
    width: 40px; height: 40px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 10px; color: var(--text);
  }
  .header-btn:active { background: #f0f0f0; }
  .header-title {
    font-size: 17px; font-weight: 600; color: var(--text);
  }

  /* 대화 영역 */
  .chat {
    flex: 1; overflow-y: auto;
    padding: 8px 0 20px;
    display: flex; flex-direction: column;
  }
  .chat-inner {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 0 16px;
    display: flex; flex-direction: column; gap: 18px;
  }

  /* 시작 화면 안내 */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--muted); text-align: center; gap: 12px;
    padding: 40px 20px;
  }
  .welcome h1 { font-size: 24px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 15px; }

  /* 메시지 */
  .msg { display: flex; width: 100%; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 85%;
    font-size: 16px; line-height: 1.6;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    padding: 10px 16px; border-radius: 20px;
  }
  .msg.assistant .bubble {
    padding: 2px 0;
  }
  .bubble img {
    max-width: 220px; border-radius: 14px; margin-bottom: 8px; display: block;
  }
  .typing { color: var(--muted); }

  /* 하단 입력 영역 */
  .composer-wrap {
    flex-shrink: 0;
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg);
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--composer-bg);
    border-radius: 26px;
    padding: 6px 6px 6px 8px;
  }
  .plus-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: var(--text);
    transition: transform .2s;
  }
  .plus-btn:active { background: #e8e8e8; }
  .plus-btn.open { transform: rotate(45deg); }
  #input {
    flex: 1; border: none; background: transparent; outline: none;
    font-size: 16px; line-height: 1.4; resize: none;
    max-height: 140px; padding: 8px 4px; color: var(--text);
    font-family: inherit;
  }
  #input::placeholder { color: var(--muted); }
  .send-btn {
    width: 36px; height: 36px; flex-shrink: 0;
    border: none; border-radius: 50%; cursor: pointer;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .2s;
  }
  .send-btn:disabled { opacity: .3; cursor: default; }

  /* + 메뉴 */
  .menu-overlay {
    position: fixed; inset: 0; z-index: 40;
    display: none;
  }
  .menu-overlay.show { display: block; }
  .menu {
    position: absolute;
    bottom: calc(72px + env(safe-area-inset-bottom));
    left: 16px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 8px 40px rgba(0,0,0,.16);
    padding: 8px;
    min-width: 260px;
    display: flex; flex-direction: column;
    transform: translateY(8px) scale(.96);
    opacity: 0;
    transition: transform .18s ease, opacity .18s ease;
  }
  .menu-overlay.show .menu {
    transform: translateY(0) scale(1); opacity: 1;
  }
  .menu-item {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 16px; border: none; background: transparent;
    cursor: pointer; border-radius: 14px; width: 100%;
    font-size: 17px; color: var(--text); text-align: left;
    font-family: inherit;
  }
  .menu-item:active { background: #f2f2f2; }
  .menu-item svg { flex-shrink: 0; }

  /* 이미지 미리보기 (전송 전) */
  .preview {
    max-width: 760px; margin: 0 auto 8px;
    display: none;
  }
  .preview.show { display: block; }
  .preview-inner {
    display: inline-flex; position: relative;
  }
  .preview img { max-height: 80px; border-radius: 12px; }
  .preview .remove {
    position: absolute; top: -6px; right: -6px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #000; color: #fff; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; line-height: 1;
  }
</style>
</head>
<body>
  <header>
    <button class="header-btn" aria-label="메뉴">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="14" y2="16"/></svg>
    </button>
    <div class="header-title">My ChatGPT</div>
    <button class="header-btn" aria-label="새 대화" onclick="newChat()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </header>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>무엇을 도와드릴까요?</h1>
      <p>옷 사진을 올리거나, 고민이나 궁금한 걸 물어보세요.</p>
    </div>
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <div class="preview" id="preview">
    <div class="preview-inner">
      <img id="previewImg" alt="첨부 이미지">
      <div class="remove" onclick="removeImage()">✕</div>
    </div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <button class="plus-btn" id="plusBtn" onclick="toggleMenu()" aria-label="추가">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="무엇이든 물어보세요"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" disabled aria-label="보내기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>

  <!-- + 메뉴 -->
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()">
    <div class="menu" onclick="event.stopPropagation()">
      <button class="menu-item" onclick="pickImage('camera')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        카메라
      </button>
      <button class="menu-item" onclick="pickImage('photo')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        사진
      </button>
      <button class="menu-item" onclick="pickImage('file')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        파일
      </button>
    </div>
  </div>

  <!-- 숨겨진 파일 입력들 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFile(this)">
  <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="onFile(this)">
  <input type="file" id="fileInput" accept="image/*,.pdf,.txt" style="display:none" onchange="onFile(this)">

<script>
  const SYSTEM_PROMPT = `You are an assistant similar to ChatGPT.
Response style:
- Give a clear conclusion first.
- Then explain reasons in structured sections.
- Use short paragraphs or bullet points.
- Speak naturally like a human conversation.
- If the user writes in Korean, respond in Korean.
When the user shares an image (e.g. clothing), describe what you see and give honest, helpful feedback.
For health questions, give general information and gently remind the user to consult a medical professional for anything important.`;

  let messages = [{ role: "system", content: SYSTEM_PROMPT }];
  let attachedImage = null; // { dataUrl, mime }

  const chatInner = document.getElementById("chatInner");
  const welcome = document.getElementById("welcome");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const chat = document.getElementById("chat");

  // 입력창 자동 높이 + 보내기 버튼 활성화
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    updateSendBtn();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  function updateSendBtn() {
    sendBtn.disabled = input.value.trim() === "" && !attachedImage;
  }

  // + 메뉴
  function toggleMenu() {
    const o = document.getElementById("menuOverlay");
    const p = document.getElementById("plusBtn");
    o.classList.toggle("show");
    p.classList.toggle("open");
  }
  function closeMenu() {
    document.getElementById("menuOverlay").classList.remove("show");
    document.getElementById("plusBtn").classList.remove("open");
  }
  function pickImage(type) {
    closeMenu();
    if (type === "camera") document.getElementById("cameraInput").click();
    else if (type === "photo") document.getElementById("photoInput").click();
    else document.getElementById("fileInput").click();
  }

  function onFile(el) {
    const file = el.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      alert("지금은 이미지 파일만 지원해요.");
      el.value = "";
      return;
    }
    // 사진이 너무 크면 서버가 못 받으므로(413 오류) 크기를 줄여서 첨부한다.
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1024; // 가장 긴 변을 1024px로 제한
        let { width, height } = img;
        if (width > MAX || height > MAX) {
          if (width > height) {
            height = Math.round(height * MAX / width);
            width = MAX;
          } else {
            width = Math.round(width * MAX / height);
            height = MAX;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        // JPEG 품질 0.8로 압축 → 용량 대폭 감소
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        attachedImage = { dataUrl: dataUrl, mime: "image/jpeg" };
        document.getElementById("previewImg").src = dataUrl;
        document.getElementById("preview").classList.add("show");
        updateSendBtn();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    el.value = "";
  }
  function removeImage() {
    attachedImage = null;
    document.getElementById("preview").classList.remove("show");
    updateSendBtn();
  }

  function newChat() {
    messages = [{ role: "system", content: SYSTEM_PROMPT }];
    chatInner.innerHTML = "";
    welcome.style.display = "flex";
    removeImage();
  }

  function addBubble(role, opts = {}) {
    welcome.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (opts.imageUrl) {
      const img = document.createElement("img");
      img.src = opts.imageUrl;
      bubble.appendChild(img);
    }
    if (opts.text) {
      const span = document.createElement("span");
      span.textContent = opts.text;
      bubble.appendChild(span);
    }
    wrap.appendChild(bubble);
    chatInner.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text && !attachedImage) return;

    // 사용자 메시지 화면에 표시
    addBubble("user", {
      text: text,
      imageUrl: attachedImage ? attachedImage.dataUrl : null,
    });

    // API용 메시지 구성
    let userContent;
    if (attachedImage) {
      userContent = [
        { type: "text", text: text || "이 이미지를 봐줘." },
        { type: "image_url", image_url: { url: attachedImage.dataUrl } },
      ];
    } else {
      userContent = text;
    }
    messages.push({ role: "user", content: userContent });

    // 입력창 초기화
    input.value = "";
    input.style.height = "auto";
    removeImage();
    updateSendBtn();

    // 어시스턴트 말풍선(타이핑 표시)
    const bubble = addBubble("assistant", {});
    bubble.innerHTML = '<span class="typing">●●●</span>';

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        bubble.textContent = "⚠️ 오류가 발생했습니다: " + (err.error || res.status);
        return;
      }

      // 스트리밍 읽기
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = "";
      bubble.textContent = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        for (const line of chunk.split("\n")) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const data = trimmed.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || "";
            full += delta;
            bubble.textContent = full;
            scrollToBottom();
          } catch (_) { /* 파싱 실패한 조각은 무시 */ }
        }
      }

      messages.push({ role: "assistant", content: full });
    } catch (err) {
      bubble.textContent = "⚠️ 연결 오류: " + err;
    }
  }
</script>
</body>
</html>
